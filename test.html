<script>

const API_BASE_URL =
  "https://chatbot-fipav-production.up.railway.app";

let sessionToken = null;
let isRegistered = false;

const root = document.getElementById("root");

document.getElementById("api-url-display").textContent =
  "Collegato a: " + API_BASE_URL;


/* =========================================================
   COMUNICAZIONE CON IL BACKEND
========================================================= */

async function api(path, opts = {}) {

  const headers = {
    "Content-Type": "application/json"
  };

  if (sessionToken) {
    headers["x-session-token"] = sessionToken;
  }

  const resp = await fetch(
    API_BASE_URL + path,
    {
      ...opts,
      headers: {
        ...headers,
        ...(opts.headers || {})
      }
    }
  );

  const data =
    await resp.json().catch(() => ({}));

  if (!resp.ok) {
    throw new Error(
      data.error ||
      "Errore di comunicazione con il server."
    );
  }

  return data;
}


/* =========================================================
   ACCESSO CON PASSWORD
========================================================= */

function renderPasswordStep() {

  root.innerHTML = `

    <div class="label">
      Accesso
    </div>

    <p style="
      font-size:13px;
      color:#7A7264;
      margin:0 0 10px;
    ">
      Inserisci la password fornita.
    </p>

    <input
      type="password"
      id="password-input"
      placeholder="Password"
    />

    <div
      class="error"
      id="password-error"
      style="display:none;">
    </div>

    <button
      class="primary"
      id="password-submit">
      Entra
    </button>

  `;


  const submit = async () => {

    const pw =
      document
        .getElementById("password-input")
        .value
        .trim();

    const errEl =
      document.getElementById(
        "password-error"
      );

    errEl.style.display = "none";

    if (!pw) return;


    try {

      const data =
        await api(
          "/api/login",
          {
            method:"POST",
            body:JSON.stringify({
              password:pw
            })
          }
        );

      sessionToken = data.token;

      renderInstructionsStep();

    }

    catch (err) {

      errEl.textContent =
        err.message;

      errEl.style.display =
        "block";

    }

  };


  document
    .getElementById(
      "password-submit"
    )
    .onclick = submit;


  document
    .getElementById(
      "password-input"
    )
    .addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {
          submit();
        }

      }
    );

}

function renderRegisterStep() {

  root.innerHTML = `

    <div class="label">
      I tuoi dati

    <p style="
      font-size:12.5px;
      color:#7A7264;
      margin:0 0 10px;
    ">

    </p>

    <input
      type="text"
      id="nome-input"
      placeholder="Nome"
    />

    <input
      type="text"
      id="cognome-input"
      placeholder="Cognome"
    />

    <select id="qualifica-input">

      <option
        value=""
        selected
        disabled>
        Seleziona la qualifica...
      </option>

      <option value="Presidente">
        Presidente
      </option>

      <option value="Dirigente">
        Dirigente
      </option>

      <option value="Direttore sportivo">
        Direttore sportivo
      </option>

      <option value="Allenatore">
        Allenatore
      </option>

      <option value="Arbitro associato">
        Arbitro associato
      </option>

      <option value="Atleta">
        Atleta
      </option>

      <option value="Altro">
        Altro
      </option>

    </select>


    <div
      class="error"
      id="register-error"
      style="display:none;">
    </div>


    <button
      class="primary"
      id="register-submit">
      Continua
    </button>

  `;


  document
    .getElementById(
      "register-submit"
    )
    .onclick =
      async () => {

        const nome =
          document
            .getElementById(
              "nome-input"
            )
            .value

        ) {

function startChat(nome) {

  root.innerHTML = `

      />

        &#10148;
      </button>

    </div>

    <button
      class="link"
      id="restart-btn">
      Esci e ricomincia
    </button>

  `;


  addMessage(
    "Buongiorno, come posso aiutarti?",
    "bot"
  );


  document
    .getElementById(
      "send-btn"
    )
    .onclick =
      askQuestion;


  document
    .getElementById(
      "question-input"
    )
    .addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {
          askQuestion();
        }

      }
    );


  document
    .getElementById(
      "restart-btn"
    )
    .onclick =
      () => {

        sessionToken = null;

        renderPasswordStep();

      };

}


/* =========================================================
   AGGIUNTA MESSAGGI
========================================================= */

function addMessage(
  text,
  who
) {

  const messages =
    document.getElementById(
      "messages"
    );

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "msg " + who;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

  messages.scrollTop =
    messages.scrollHeight;

  return row;

}


/* =========================================================
   INVIO DOMANDA
========================================================= */

async function askQuestion() {

  const input =
    document.getElementById(
      "question-input"
    );

  const text =
    input.value.trim();

  if (!text) return;


  addMessage(
    text,
    "user"
  );


  input.value =
    "";


  const sendBtn =
    document.getElementById(
      "send-btn"
    );

  sendBtn.disabled =
    true;


  const thinkingRow =
    addMessage(
      "Sto pensando...",
      "system"
    );


  try {

    const data =
      await api(
        "/api/chat",
        {
          method:"POST",
          body:JSON.stringify({
            domanda:text
          })
        }
      );


    thinkingRow.remove();


    addMessage(
      data.risposta,
      "bot"
    );


    if (
      typeof data.remaining ===
      "number"
    ) {

      document
        .getElementById(
          "counter-line"
        )
        .textContent =
          "Domande rimanenti questo mese: " +
          data.remaining;

    }

  }

  catch (err) {

    thinkingRow.remove();

    addMessage(
      err.message,
      "system"
    );

  }

  finally {

    sendBtn.disabled =
      false;

  }

}


/* =========================================================
   AVVIO
========================================================= */

renderPasswordStep();

</script>
