<body style="margin:0; padding:24px; background:#f5f2ea;">

<div id="app" style="max-width:520px; margin:0 auto; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

  #app .apiurl {

  #app .faq-box {

  #app .faq-toggle .faq-caret {

  #app .faq-list {

  #app .faq-list.open {

  #app .faq-item {
    border-top:1px solid #DDD5C7;

  }

  #app .faq-item:first-child {
    border-top:none;
    padding-top:0;
  }

    white-space:pre-wrap;
    line-height:1.45;
  }

  #app .faq-a.open {
    display:block;
  }

  #app .faq-meta {
    font-size:10.5px;
    color:#7A7264;
    margin-top:2px;
  }
.societa-banner {
  display: none;
  text-align: center;
  font-weight: 700;
  font-size: 18px;
  color: #14305c;
  margin: 12px auto 0;
  max-width: 650px;
}
</style>


<div class="header">
  <img
    src="https://letiziaamoroso.github.io/chatbot-fipav/logo.png"
    alt="Logo FIPAV"
    onerror="this.style.display='none'"
  />
</div>

<div class="societa-banner" id="societa-banner"></div>

<div class="card" id="root"></div>

<div class="apiurl" id="api-url-display"></div>


<script>

const API_BASE_URL =
  "https://chatbot-fipav-production.up.railway.app";

let sessionToken = null;
let isRegistered = false;

const root = document.getElementById("root");

document.getElementById("api-url-display").textContent =
  "Collegato a: " + API_BASE_URL;


/* =========================================================
   COMUNICAZIONE CON IL BACKEND
========================================================= */

async function api(path, opts = {}) {

  const headers = {
    "Content-Type": "application/json"
  };

  if (sessionToken) {
    headers["x-session-token"] = sessionToken;
  }

  const resp = await fetch(
    API_BASE_URL + path,
    {
      ...opts,
      headers: {
        ...headers,
        ...(opts.headers || {})
      }
    }
  );

  const data =
    await resp.json().catch(() => ({}));

  if (!resp.ok) {
    throw new Error(
      data.error ||
      "Errore di comunicazione con il server."
    );
  }

  return data;
}


/* =========================================================
   ACCESSO CON PASSWORD
========================================================= */

function renderPasswordStep() {

  root.innerHTML = `

    <div class="label">
      Accesso
    </div>

    <p style="
      font-size:13px;
      color:#7A7264;
      margin:0 0 10px;
    ">
      Inserisci la password fornita.
    </p>

    <input
      type="password"
      id="password-input"
      placeholder="Password"
    />

    <div
      class="error"
      id="password-error"
      style="display:none;">
    </div>

    <button
      class="primary"
      id="password-submit">
      Entra
    </button>

  `;


  const submit = async () => {

    const pw =
      document
        .getElementById("password-input")
        .value
        .trim();

    const errEl =
      document.getElementById(
        "password-error"
      );

    errEl.style.display = "none";

    if (!pw) return;


    try {

      const data =
        await api(
          "/api/login",
          {
            method:"POST",
            body:JSON.stringify({
              password:pw
            })
          }
        );

      sessionToken = data.token;

      const banner = document.getElementById("societa-banner");
      if (banner && data.societa) {
        banner.textContent = data.societa;
        banner.style.display = "block";
      }

      renderInstructionsStep();

    }

    catch (err) {

      errEl.textContent =
        err.message;

      errEl.style.display =
        "block";

    }

  };


  document
    .getElementById(
      "password-submit"
    )
    .onclick = submit;


  document
    .getElementById(
      "password-input"
    )
    .addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {
          submit();
        }

      }
    );

}


/* =========================================================
   ISTRUZIONI
========================================================= */

function renderInstructionsStep() {

  root.innerHTML = `

    <div style="font-size:18px; font-weight:700; color:#16305C; margin-bottom:12px;">
      Servizio di Assistenza Virtuale (chatbot)
    </div>

    <p style="font-size:13px; line-height:1.55; color:#2A2A2A; margin:0 0 18px;">
      Il servizio mette a disposizione un assistente virtuale (chatbot) progettato per rispondere ai quesiti degli utenti basandosi
      <strong>esclusivamente sulla DOCUMENTAZIONE UFFICIALE DELLA FEDERAZIONE ITALIANA PALLAVOLO E DEL COMITATO REGIONALE FIPAV MARCHE.</strong>
    </p>

    <div style="background:#EFE9DD; border-radius:10px; padding:12px; margin-bottom:16px;">
      <div style="font-size:14px; font-weight:700; color:#16305C; margin-bottom:12px;">
        📌 Modalità di funzionamento e raccomandazioni d'uso
      </div>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 10px;">
        <strong>Argomenti già trattati:</strong> Prima di porre una nuova domanda al chatbot, si invita a consultare l'elenco delle <strong>FAQ - Domande e risposte frequenti</strong> disponibili ed aggiornate al seguente link: <a href="https://marche.federvolley.it/faq-domande-e-risposte-ricorrenti/" target="_blank" rel="noopener" style="color:#16305C; font-weight:600;">FAQ - Domande e risposte frequenti</a>. In questa sezione (in aggiornamento) sono già presenti le risposte ai quesiti e dubbi più comuni.
      </p>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 10px;">
        <strong>Documentazione di riferimento:</strong> Il chatbot risponde soltanto su argomenti presenti nei testi ufficiali. Per la consultazione integrale o per eventuali verifiche dirette, la documentazione completa è disponibile al seguente link: <a href="https://marche.federvolley.it/esame-della-normativa-vigente/" target="_blank" rel="noopener" style="color:#16305C; font-weight:600;">La Normativa Vigente in dettaglio</a>.
      </p>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 10px;">
        <strong>Formulazione dei quesiti:</strong> Si raccomanda di porre le domande in modo chiaro e dettagliato. È possibile inserire domande successive per affinare le risposte o richiedere ulteriori dettagli.
      </p>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 10px;">
        <strong>Valore delle risposte:</strong> Le informazioni fornite dall'assistente virtuale hanno carattere informativo. Ogni risposta va pertanto letta, compresa e verificata rispetto ai testi ufficiali presenti sul sito.
      </p>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 0;">
        <strong>Argomenti non presenti:</strong> Qualora un'informazione non sia reperibile nella documentazione, il chatbot lo segnalerà e indicherà le vie alternative di contatto con il Comitato (ad esempio e-mail). Le risposte a tali richieste verranno quindi fornite necessariamente secondo tempistiche non immediate e modalità ordinarie.
      </p>
    </div>

    <div style="background:#FFF4E2; border-left:4px solid #F2A93B; border-radius:8px; padding:12px; margin-bottom:16px;">
      <div style="font-size:14px; font-weight:700; color:#16305C; margin-bottom:12px;">
        ⚠️ Condizioni di accesso e limiti di utilizzo
      </div>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 6px;">
        <strong>Limite di domande per società:</strong> In considerazione dei costi procedurali, è consentito per ciascuna società un numero massimo di domande con i seguenti limiti:
      </p>
      <ul style="font-size:12.5px; line-height:1.5; margin:0 0 10px; padding-left:20px;">
        <li><strong>20 domande</strong> per il periodo dal 1/dic/2026 al 31/dic/2026</li>
        <li><strong>50 domande</strong> per ogni mese durante il periodo dal 1/gen/2027 al 30/giu/2027.</li>
      </ul>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 10px;">
        Superati tali limiti, l'accesso verrà bloccato per il mese in corso, con ripristino automatico all'inizio del mese successivo; in alternativa potrà essere ripristinato su specifica richiesta al <strong>COMITATO REGIONALE</strong>.
      </p>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 10px;">
        <strong>Autenticazione e identificazione:</strong> La password di accesso è condivisa tra gli utenti appartenenti alla medesima società. Nella schermata seguente e ad ogni accesso successivo è richiesto l'inserimento di <strong>Nome, Cognome e Qualifica</strong> del richiedente.
      </p>
      <p style="font-size:12.5px; line-height:1.5; margin:0 0 0;">
        <strong>Trattamento dati e riservatezza:</strong> I dati identificativi inseriti saranno trattati nel rispetto della normativa sulla privacy al solo fine di gestire e monitorare gli accessi. Si richiede di non inserire dati personali sensibili o informazioni riservate all'interno dei testi delle domande.
      </p>
    </div>

    <button
      class="primary"
      id="instr-continue">

      Ho letto, continua

    </button>

  `;


  document
    .getElementById(
      "instr-continue"
    )
    .onclick =
      renderRegisterStep;

}


/* =========================================================
   IDENTIFICAZIONE UTENTE
========================================================= */

function renderRegisterStep() {

  root.innerHTML = `

    <div class="label">
      I tuoi dati
    </div>

    <p style="
      font-size:12.5px;
      color:#7A7264;
      margin:0 0 10px;
    ">
      Questa password è condivisa:
      indica chi sei ad ogni accesso.
    </p>

    <input
      type="text"
      id="nome-input"
      placeholder="Nome"
    />

    <input
      type="text"
      id="cognome-input"
      placeholder="Cognome"
    />

    <select id="qualifica-input">

      <option
        value=""
        selected
        disabled>
        Seleziona la qualifica...
      </option>

      <option value="Presidente">
        Presidente
      </option>

      <option value="Dirigente">
        Dirigente
      </option>

      <option value="Direttore sportivo">
        Direttore sportivo
      </option>

      <option value="Allenatore">
        Allenatore
      </option>

      <option value="Arbitro associato">
        Arbitro associato
      </option>

      <option value="Atleta">
        Atleta
      </option>

      <option value="Altro">
        Altro
      </option>

    </select>


    <div
      class="error"
      id="register-error"
      style="display:none;">
    </div>


    <button
      class="primary"
      id="register-submit">
      Continua
    </button>

  `;


  document
    .getElementById(
      "register-submit"
    )
    .onclick =
      async () => {

        const nome =
          document
            .getElementById(
              "nome-input"
            )
            .value
            .trim();

        const cognome =
          document
            .getElementById(
              "cognome-input"
            )
            .value
            .trim();

        const qualifica =
          document
            .getElementById(
              "qualifica-input"
            )
            .value;

        const errEl =
          document.getElementById(
            "register-error"
          );

        errEl.style.display =
          "none";


        if (
          !nome ||
          !cognome ||
          !qualifica
        ) {

          errEl.textContent =
            "Nome, cognome e qualifica sono obbligatori.";

          errEl.style.display =
            "block";

          return;

        }


        try {

          const payload = {
            nome,
            cognome,
            qualifica
          };

          await api(
            "/api/register",
            {
              method:"POST",
              body:JSON.stringify(payload)
            }
          );

          startChat(nome);

        }

        catch (err) {

          errEl.textContent =
            err.message;

          errEl.style.display =
            "block";

        }

      };

}


/* =========================================================
   ELENCO DOMANDE GIÀ FATTE DALLA SOCIETÀ
   (per evitare ripetizioni di domande già poste)
========================================================= */

async function renderMieDomande() {

  let domande = [];

  try {
    domande = await api("/api/mie-domande");
  } catch {
    return; // se la chiamata fallisce, non blocchiamo la chat
  }

  if (!Array.isArray(domande) || domande.length === 0) return;

  const faqBox = document.createElement("div");
  faqBox.className = "faq-box";

  faqBox.innerHTML = `
    <button class="faq-toggle" id="faq-toggle" type="button">
      <span>📋 Domande già fatte dalla tua società (${domande.length})</span>
      <span class="faq-caret">▶</span>
    </button>
    <div class="faq-list" id="faq-list"></div>
  `;

  const toggleBtn = faqBox.querySelector("#faq-toggle");
  const list = faqBox.querySelector("#faq-list");

  domande.forEach((d, i) => {
    const item = document.createElement("div");
    item.className = "faq-item";
    const dataStr = d.timestamp
      ? new Date(d.timestamp.replace(" ", "T") + "Z").toLocaleDateString("it-IT")
      : "";
    item.innerHTML = `
      <p class="faq-q">❓ ${d.domanda}</p>
      <div class="faq-meta">${[d.nome, d.cognome].filter(Boolean).join(" ")}${dataStr ? " · " + dataStr : ""}</div>
      <p class="faq-a" id="faq-a-${i}">${d.risposta || "(risposta non disponibile)"}</p>
    `;
    item.querySelector(".faq-q").addEventListener("click", () => {
      item.querySelector(".faq-a").classList.toggle("open");
    });
    list.appendChild(item);
  });

  toggleBtn.addEventListener("click", () => {
    toggleBtn.classList.toggle("open");
    list.classList.toggle("open");
  });

  document.getElementById("messages-wrap").appendChild(faqBox);

}


/* =========================================================
   CHAT
========================================================= */

function startChat(nome) {

  root.innerHTML = `

    <div class="summary">
      Connesso come
      <b>${nome || "utente"}</b>
      — backend online reale
    </div>

    <div id="messages-wrap"></div>

    <div
      class="messages"
      id="messages">
    </div>

    <div
      class="counter"
      id="counter-line">
    </div>

    <div class="row">

      <input
        type="text"
        id="question-input"
        placeholder="Scrivi una domanda vera..."
      />

      <button
        class="send"
        id="send-btn">
        &#10148;
      </button>

    </div>

    <button
      class="link"
      id="restart-btn">
      Esci e ricomincia
    </button>

  `;


  renderMieDomande();

  addMessage(
    "Buongiorno, come posso aiutarti?",
    "bot"
  );


  document
    .getElementById(
      "send-btn"
    )
    .onclick =
      askQuestion;


  document
    .getElementById(
      "question-input"
    )
    .addEventListener(
      "keydown",
      e => {

        if (e.key === "Enter") {
          askQuestion();
        }

      }
    );


  document
    .getElementById(
      "restart-btn"
    )
    .onclick =
      () => {

        sessionToken = null;

        renderPasswordStep();

      };

}


/* =========================================================
   AGGIUNTA MESSAGGI
========================================================= */

function addMessage(
  text,
  who
) {

  const messages =
    document.getElementById(
      "messages"
    );

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "msg " + who;


  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  row.appendChild(
    bubble
  );

  messages.appendChild(
    row
  );

  messages.scrollTop =
    messages.scrollHeight;

  return row;

}


/* =========================================================
   INVIO DOMANDA
========================================================= */

async function askQuestion() {

  const input =
    document.getElementById(
      "question-input"
    );

  const text =
    input.value.trim();

  if (!text) return;


  addMessage(
    text,
    "user"
  );


  input.value =
    "";


  const sendBtn =
    document.getElementById(
      "send-btn"
    );

  sendBtn.disabled =
    true;


  const thinkingRow =
    addMessage(
      "Sto pensando...",
      "system"
    );


  try {

    const data =
      await api(
        "/api/chat",
        {
          method:"POST",
          body:JSON.stringify({
            domanda:text
          })
        }
      );


    thinkingRow.remove();


    addMessage(
      data.risposta,
      "bot"
    );


    if (
      typeof data.remaining ===
      "number"
    ) {

      document
        .getElementById(
          "counter-line"
        )
        .textContent =
          "Domande rimanenti questo mese: " +
          data.remaining;

    }

  }

  catch (err) {

    thinkingRow.remove();

    addMessage(
      err.message,
      "system"
    );

  }

  finally {

    sendBtn.disabled =
      false;

  }

}


/* =========================================================
   AVVIO
========================================================= */

renderPasswordStep();

</script>

</div>

</body>
</html>
